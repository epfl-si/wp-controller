services:
  wp-controller:
    build: .
    image: wp-controller:dev
    environment:
      WATCH_NAMESPACE: svc0041t-wordpress
      NGINX_CONF_PATH: /etc/nginx/conf.d/wordpress.conf
      RELOAD_DEBOUNCE_SECONDS: "2"
      LOG_LEVEL: DEBUG
      # Uncomment to deliberately generate an invalid config and exercise the
      # failure path (rejected-config file, config_valid=0 metric).
      # FORCE_INVALID_CONFIG: "1"
      KUBECONFIG: /kubeconfig/config
    volumes:
      # Point at whatever cluster your `kubectl` already talks to.
      # Override with `export KUBECONFIG=...` before `docker compose up`
      # if your kubeconfig isn't the default `~/.kube/config`.
      - ${KUBECONFIG:-$HOME/.kube/config}:/kubeconfig/config:ro
      # Mount the source so `docker compose restart` picks up edits
      # without a full rebuild.
      - ./main.py:/app/main.py:ro
      - ./src:/app/src:ro
      # .dockerignore excludes this from the image, mount it for dev only.
      - ./requirements-dev.txt:/app/requirements-dev.txt:ro
    ports:
      - "8080:8080"
      - "9145:9145"
      - "9190:9190"
    # Auto-restart kopf whenever a mounted .py file changes, for a real
    # edit-and-see-it-reload dev loop instead of a static one-shot run.
    command: >
      sh -c "pip install --no-cache-dir -r requirements-dev.txt &&
      watchmedo auto-restart --pattern=*.py --recursive --
      kopf run main.py --namespace=$$WATCH_NAMESPACE"
