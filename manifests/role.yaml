apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wp-controller
  namespace: wordpress-test
rules:
  # The resource wp-controller actually reconciles. Watched via the raw
  # @kopf.on.event handler (see src/handlers/wordpresssite.py), which -
  # unlike @kopf.on.create/update/delete/resume - has no diff-base/progress
  # state to persist. `patch` is still needed though: kopf always reconciles
  # its own finalizer (settings.persistence.finalizer, see main.py) against
  # the object regardless of handler type, adding/removing it as needed.
  - apiGroups: ["wordpress.epfl.ch"]
    resources: ["wordpresssites"]
    verbs: ["get", "list", "watch", "patch"]
  # Read-only lookup of the MariaDB Database/User that wp-operator
  # provisions for each WordpressSite. Listed once per sync and matched by
  # ownerReference in-memory, rather than `get` per site, to avoid N+1
  # API calls. Also watched (src/handlers/wordpresssite.py), so a change
  # to either triggers a re-sync.
  - apiGroups: ["k8s.mariadb.com"]
    resources: ["databases", "users"]
    verbs: ["list", "watch"]
  # The Secret holding each site's database password, same lookup and
  # same watch (a rotated password must reach the nginx config).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch"]
  # kopf posts Kubernetes Events to describe what it did.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
