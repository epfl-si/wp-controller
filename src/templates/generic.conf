set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 172.69.225.0/24;
set_real_ip_from 162.158.148.0/24;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# set trusted EPFL IP ranges
set_real_ip_from 10.20.0.0/16;      # prod/test
set_real_ip_from 128.178.211.0/24;  # prod/test
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Log to stderr so `kubectl logs`/`docker logs` show nginx's own errors.
error_log stderr;

client_body_temp_path /tmp/nginx/client_body;
proxy_temp_path       /tmp/nginx/proxy;
fastcgi_temp_path     /tmp/nginx/fastcgi;
uwsgi_temp_path       /tmp/nginx/uwsgi;
scgi_temp_path        /tmp/nginx/scgi;
client_max_body_size  50M;

# Default nginx values are too small for WordPress, see
# https://stackoverflow.com/questions/23844761/upstream-sent-too-big-header-while-reading-response-header-from-upstream
fastcgi_buffers 16 32k;
fastcgi_buffer_size 64k;
fastcgi_busy_buffers_size 64k;

# wp-bom.yaml is served directly (see the static asset whitelist location).
types {
    application/yaml yaml yml;
}

# Prometheus metrics, matching wordpress-nginx (wp-ops' docker/wordpress-nginx)
# byte for byte - same metric names/labels and the same nginx-metrics port,
# so its PodMonitor (ansible/roles/wordpress-namespace/tasks/nginx.yml) and
# existing dashboards/alerts work unmodified against this container too. The
# lua/ files are the vendored knyar/nginx-lua-prometheus library, unchanged.
lua_package_path "/etc/nginx/lua/?.lua;;";
lua_shared_dict prometheus_metrics 10M;

init_worker_by_lua_block {
    prometheus = require("prometheus").init("prometheus_metrics")

    metric_requests = prometheus:counter(
        "nginx_http_requests_total", "Number of HTTP requests", {"host", "status"})
    metric_latency = prometheus:histogram(
        "nginx_http_request_duration_seconds", "HTTP request latency", {"host"})
    metric_connections = prometheus:gauge(
        "nginx_http_connections", "Number of HTTP connections", {"state"})
}

log_by_lua_block {
    metric_requests:inc(1, {ngx.var.server_name, ngx.var.status})
    metric_latency:observe(tonumber(ngx.var.request_time), {ngx.var.server_name})
}

server {
    listen 9145;
    location /metrics {
        content_by_lua_block {
            metric_connections:set(ngx.var.connections_reading, {"reading"})
            metric_connections:set(ngx.var.connections_waiting, {"waiting"})
            metric_connections:set(ngx.var.connections_writing, {"writing"})
            prometheus:collect()
        }
    }
}
